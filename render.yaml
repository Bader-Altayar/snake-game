# Render Blueprint: deploys the web service + a free PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec
#
# After the first deploy, run the schema once against the new database:
#   psql "$DATABASE_URL" -f schema.sql
# or, from a Render shell on the service: npm run db:init

databases:
  - name: snake-db
    plan: free
    databaseName: snake_db
    user: snake_user

services:
  - type: web
    name: snake-game
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: snake-db
          property: connectionString
